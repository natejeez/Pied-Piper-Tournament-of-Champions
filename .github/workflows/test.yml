name: Tests

on:
  push:
  pull_request:

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-sqlite tests/vote-database-regression.mjs
      - run: node --experimental-sqlite tests/worker-d1-regression.mjs
      - run: node tests/v27-participant-regression.mjs
      - run: node tests/v28-participant-regression.mjs
      - run: node tests/v29-regression.mjs
      - run: node tests/v213-production-regression.mjs
